name: MathLab Windows portable and one-file builds
on:
  push:
    branches: [main, feature/mathlab-v1.1, fix/mathlab-v1.1.1-audit, fix/mathlab-v1.1.5-polish]
    tags: ['v*', 'mathlab-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 40
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'mathlab-v1.1.5') { throw 'This source version builds MathLab v1.1.5 only' }
      - name: Install verified locked dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock
      - name: Test mathematics, project files and desktop workflows
        id: tests
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: Report actual test failures in public annotations
        if: always() && steps.tests.outcome != 'skipped'
        run: python scripts/report_test_failures.py artifacts/tests.xml
      - name: Check out the published baseline for same-runner comparisons
        uses: actions/checkout@v4
        with:
          ref: mathlab-v1.1.4
          path: .benchmark-baseline
          persist-credentials: false
      - name: Measure published baseline interactions on the same runner
        env:
          MATHLAB_BENCH_SOURCE: ${{ github.workspace }}/.benchmark-baseline
        run: python scripts/benchmark_interaction.py --output artifacts/baseline-interaction.json --frames 30 --session-steps 400
      - name: Measure published baseline stabilization workloads on the same runner
        env:
          MATHLAB_BENCH_SOURCE: ${{ github.workspace }}/.benchmark-baseline
        run: python scripts/benchmark_stabilization.py --frames 20 --output artifacts/baseline-stabilization.json
      - name: Measure offscreen interactions
        run: python scripts/benchmark_interaction.py --output artifacts/interaction-benchmark.json --frames 30 --session-steps 400
      - name: Measure stabilization workloads
        run: python scripts/benchmark_stabilization.py --frames 20 --output artifacts/stabilization-benchmark.json
      - name: Source application smoke test
        run: python -m graphmath --smoke-test --smoke-output artifacts/source-smoke
      - name: Capture actual workspace, dropdown and typography screenshots
        run: python scripts/capture_stabilization_qa.py --output artifacts/screenshots
      - name: Capture actual Qt 125 percent display scaling
        env:
          QT_SCALE_FACTOR: '1.25'
        run: python scripts/capture_stabilization_qa.py --dpi-only --output artifacts/screenshots-dpi125
      - name: Capture actual Qt 150 percent display scaling
        env:
          QT_SCALE_FACTOR: '1.5'
        run: python scripts/capture_stabilization_qa.py --dpi-only --output artifacts/screenshots-dpi150
      - name: Collect bundled license notices
        run: python scripts/collect_licenses.py build/licenses
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean GraphMath.spec
      - name: Verify portable packaged resources
        run: python scripts/verify_distribution.py dist/MathLab
      - name: Build single-file application
        env:
          GRAPHMATH_ONEFILE: '1'
        run: python -m PyInstaller --noconfirm --clean --distpath dist-onefile --workpath build/onefile GraphMath.spec
      - name: Verify embedded one-file runtime, resources, fonts, licenses and modules
        run: python scripts/verify_onefile.py dist-onefile/MathLab.exe --output artifacts/onefile-archive.json
      - name: Verify both frozen formats outside checkout without Python on PATH
        run: python scripts/verify_frozen_app.py --onedir dist/MathLab/MathLab.exe --onefile dist-onefile/MathLab.exe --output artifacts/packaged-validation --version 1.1.5
      - name: Package release files and checksums
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md dist/MathLab/
          Copy-Item docs/user-guide.uk.md dist/MathLab/ПОСІБНИК.md
          Compress-Archive -Path dist/MathLab -DestinationPath MathLab-v1.1.5-Windows-x64.zip
          Copy-Item dist-onefile/MathLab.exe MathLab-v1.1.5-Windows-x64-OneFile.exe
          $names = @('MathLab-v1.1.5-Windows-x64.zip', 'MathLab-v1.1.5-Windows-x64-OneFile.exe')
          $sums = foreach ($name in $names) {
            if ((Get-Item $name).Length -lt 1000000) { throw "Release file is unexpectedly small: $name" }
            $hash = (Get-FileHash $name -Algorithm SHA256).Hash.ToLower()
            "$hash  $name"
          }
          $sums | Set-Content -Encoding ascii SHA256SUMS.txt
      - name: Verify public ZIP and SHA256
        run: python scripts/verify_release_zip.py MathLab-v1.1.5-Windows-x64.zip SHA256SUMS.txt
      - name: Verify public single-file EXE and SHA256
        run: python scripts/verify_onefile.py MathLab-v1.1.5-Windows-x64-OneFile.exe --checksums SHA256SUMS.txt --output artifacts/onefile-release.json
      - uses: actions/upload-artifact@v4
        with:
          name: MathLab-v1.1.5-Windows-x64
          path: |
            MathLab-v1.1.5-Windows-x64.zip
            MathLab-v1.1.5-Windows-x64-OneFile.exe
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: artifacts/
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/mathlab-v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MathLab-v1.1.5-Windows-x64
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: validation-evidence
          path: validation-evidence
      - name: Archive Windows validation evidence
        run: python3 -c "import shutil; shutil.make_archive('release/MathLab-v1.1.5-validation', 'zip', 'validation-evidence')"
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          Focused typography and packaging polish; mathematical algorithms and graph interaction remain unchanged. Bundled OFL-licensed Inter with Ukrainian glyph checks, clearer coefficient/explanation spacing, grouped nonselectable dropdown headings and removal of the redundant introductory instruction.

          Download the single-file Windows x64 EXE, or extract the portable ZIP and launch MathLab.exe. No Python installation is required. Both formats passed native Windows startup, coefficient, plotting, project saving, analysis worker, font/resource and PNG/SVG/PDF smoke checks outside the source checkout with Python removed from PATH. The validation ZIP contains test results, actual Qt screenshots at 100/125/150 percent display scaling, startup timings and benchmarks.

          One-file startup includes temporary extraction and can be slower; antivirus may flag unsigned executables. The portable ZIP remains available, including for replacing LGPL libraries. Physical Windows 11 compositor behavior, antivirus reputation and hardware FPS are not established by offscreen CI. Previous releases remain preserved.
          EOF
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "MathLab v1.1.5" --notes-file release-notes.md release/MathLab-v1.1.5-Windows-x64.zip release/MathLab-v1.1.5-Windows-x64-OneFile.exe release/SHA256SUMS.txt release/MathLab-v1.1.5-validation.zip
