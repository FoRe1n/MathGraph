name: Windows portable build
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements-windows.lock
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_NAME -ne 'v1.0.0') { throw 'This source version builds v1.0.0 only' }
      - name: Install verified locked dependencies
        run: python -m pip install --require-hashes -r requirements-windows.lock
      - name: Test mathematics, project files and desktop workflows
        run: python -m pytest -q --junitxml=artifacts/tests.xml
      - name: Source application smoke test
        run: python -m graphmath --smoke-test --smoke-output artifacts/source-smoke
      - name: Collect bundled license notices
        run: python scripts/collect_licenses.py build/licenses
      - name: Build portable application
        run: python -m PyInstaller --noconfirm --clean GraphMath.spec
      - name: Verify packaged resources
        run: python scripts/verify_distribution.py dist/GraphMath
      - name: Frozen application smoke test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath dist/GraphMath/GraphMath.exe -ArgumentList '--smoke-test','--smoke-output','artifacts/frozen-smoke' -PassThru
          if (-not $process.WaitForExit(90000)) { $process.Kill(); throw 'Frozen startup timed out' }
          if ($process.ExitCode -ne 0) { throw "Frozen smoke exit code: $($process.ExitCode)" }
          $result = Get-Content artifacts/frozen-smoke/result.json | ConvertFrom-Json
          if ($result.status -ne 'passed') { throw 'Frozen smoke results missing or failed' }
      - name: Package portable ZIP
        shell: pwsh
        run: |
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md dist/GraphMath/
          Copy-Item docs/user-guide.uk.md dist/GraphMath/ПОСІБНИК.md
          Compress-Archive -Path dist/GraphMath -DestinationPath GraphMath-v1.0.0-Windows-x64.zip
          if ((Get-Item GraphMath-v1.0.0-Windows-x64.zip).Length -lt 1000000) { throw 'Archive is unexpectedly small' }
          $hash = (Get-FileHash GraphMath-v1.0.0-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  GraphMath-v1.0.0-Windows-x64.zip" | Set-Content -Encoding ascii SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: GraphMath-v1.0.0-Windows-x64
          path: |
            GraphMath-v1.0.0-Windows-x64.zip
            SHA256SUMS.txt
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-evidence
          path: artifacts/
          if-no-files-found: warn
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: GraphMath-v1.0.0-Windows-x64
          path: release
      - name: Publish verified Windows release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag --title "GraphMath $GITHUB_REF_NAME" --notes 'Portable Windows x64. Extract the ZIP and double-click GraphMath.exe. No Python installation is required. Includes Ukrainian UI, safe expression input, independent parameters, analysis, project files, PNG/SVG/PDF export, and light/dark themes. Unsigned build. See bundled user guide and license notices.' release/GraphMath-v1.0.0-Windows-x64.zip release/SHA256SUMS.txt
