[build-system]
requires = ["setuptools==78.1.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "graphmath"
version = "1.1.5"
description = "MathLab: an offline interactive mathematics laboratory"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "GraphMath contributors"}]
dependencies = [
  "PySide6==6.8.3", "pyqtgraph==0.13.7", "sympy==1.13.3",
  "numpy==2.2.4", "matplotlib==3.10.1"
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pytest-qt==4.4.0", "pyinstaller==6.12.0"]

[project.scripts]
graphmath = "graphmath.app.main:main"
mathlab = "graphmath.app.main:main"

[tool.setuptools.packages.find]
include = ["graphmath*"]

[tool.setuptools.package-data]
graphmath = ["resources/*", "resources/licenses/*", "resources/fonts/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
